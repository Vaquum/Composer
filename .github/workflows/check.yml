name: Check Composer
# Pull requests run these checks on their own; main runs them once through deploy.yml, on the exact
# commit it deploys.
on:
  pull_request:
  workflow_call:
    outputs:
      sha:
        description: The commit these checks checked out and tested
        value: ${{ jobs.checks.outputs.sha }}
permissions:
  contents: read
jobs:
  checks:
    name: Unit tests and the matcher's checks on the current bars
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: The shared Filang engine, at the release engine.json names
        run: python engine.py
      - name: The matcher this branch replaced, for the comparison below
        run: git fetch --depth 1 origin bd6a0ba32e18548b641267418491bfb5f011a274
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The chain, each bar opening at the previous close
        run: node checks/chain.mjs
      - name: A recorded window read as a chain, on the vectors shared with Filang
        run: node checks/chained-vectors.mjs
      - name: Dimension drawings and counters against the shared Filang vectors
        run: node checks/dimension-vectors.mjs
      - name: Similarity ranking against an independent brute force, on the current bars
        run: python checks/with_bars.py checks/similarity-windows.mjs
      - name: Two-bar colours and proportions
        run: python checks/with_bars.py checks/similarity-look.mjs
      - name: Every figure against the matcher this replaced, on the current bars
        run: python checks/with_bars.py checks/engine-parity.mjs
      - name: The panes against an independent recomputation
        run: python checks/with_bars.py checks/panes.mjs
      - name: Real-history search latency and cancellation work slices
        run: python checks/with_bars.py checks/search-performance.mjs
      - name: Activity preparation yields and publishes complete statistics
        run: python checks/with_bars.py checks/activity-preparation.mjs
      - name: Real cold and warm loading stability
        run: python checks/with_bars.py checks/loading-performance.mjs
      - name: Composer at the root URL, key by key, on the current bars
        run: python checks/with_bars.py checks/bench.mjs
      - name: The container builds
        run: python checks/container.py
