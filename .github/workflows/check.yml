name: Check Composer
# Pull requests run these checks on their own; main runs them once through deploy.yml, on the exact
# commit it deploys.
on:
  pull_request:
  workflow_call:
    outputs:
      sha:
        description: The commit these checks checked out and tested
        value: ${{ jobs.checks.outputs.sha }}
permissions:
  contents: read
jobs:
  checks:
    name: Unit tests and the matcher's checks on the current bars
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Tactile motion model and browser continuity
        run: npm run test:motion
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The page and its reference
        run: node checks/page.mjs
      - name: Independent pane designs and statistical presentation
        run: node checks/pane-designs.mjs
      - name: Canvas sequence probabilities and conditional presentation
        run: node checks/forecast.mjs
      - name: Seamless forecast state and layout transitions
        run: node checks/forecast-ux.mjs
      - name: The feel of a drag, continuous with no jump
        run: node checks/drag.mjs
      - name: The chain, each bar opening at the previous close
        run: node checks/chain.mjs
      - name: Similarity ranking against an independent brute force, on the current bars
        run: python checks/with_bars.py checks/similarity-windows.mjs
      - name: Two-bar colours and proportions
        run: python checks/with_bars.py checks/similarity-look.mjs
      - name: Bounded search against the unbounded one
        run: python checks/with_bars.py checks/similarity-equivalence.mjs
      - name: The panes against an independent recomputation
        run: python checks/with_bars.py checks/panes.mjs
      - name: The container builds
        run: python checks/container.py
