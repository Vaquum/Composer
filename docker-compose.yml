# Composer on the Origo host: host network, serving on 127.0.0.1:8488 only, for the host's Caddy
# (deployed from Vaquum/Portal) to put composer.vaquum.fi in front of it behind the portal login.
# It reads its bars from the Vaquum HuggingFace kline files when it starts and every hour after.
name: composer
services:
  composer:
    build: .
    image: composer:latest
    network_mode: host
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8488/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
